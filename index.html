
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inscription - ESEF</title>
<style>
* { box-sizing: border-box; }
body {
  font-family: Arial, sans-serif;
  background: #f3f5f9;
  margin: 0;
  padding: 25px 15px;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
}
.container {
  background: white;
  width: 100%;
  max-width: 440px;
  padding: 28px 24px;
  border-radius: 15px;
  box-shadow: 0 5px 25px #00000012;
}
.logo {
  display: block;
  width: 100%;
  max-width: 360px;
  height: auto;
  margin: 0 auto 25px;
}
h2 {
  text-align: center;
  color: #183b66;
  font-size: 22px;
}
p {
  text-align: center;
  color: #666;
}
label {
  display: block;
  margin: 20px 0 8px;
  color: #333;
}
input {
  width: 100%;
  padding: 14px;
  border: 1px solid #ccc;
  border-radius: 8px;
  font-size: 16px;
}
button {
  width: 100%;
  padding: 14px;
  margin-top: 25px;
  border: none;
  border-radius: 8px;
  background: #183b66;
  color: white;
  font-size: 16px;
  cursor: pointer;
}
button:disabled { opacity: .6; }
#status {
  margin-top: 15px;
  text-align: center;
  font-size: 14px;
}
</style>
</head>
<body>

<div class="container">

<img src="1000097381.png" class="logo"
     alt="Logo de l'établissement">

<h2>Formulaire d'inscription</h2>
<p>Veuillez remplir les informations suivantes.</p>

<form id="registrationForm"
action="https://script.google.com/macros/s/AKfycbwdO4_B_uuLRwVYAkoNtgM3U1BdpEOTTxLgaBpK6wM1E0pcWoypWgw9uSpQXV-oonyc6Q/exec"
method="POST"
target="submitFrame">

<label for="name">Nom et prénom</label>
<input id="name" name="name" type="text" required>

<label for="phone">Numéro de téléphone</label>
<input id="phone" name="phone" type="tel"
inputmode="tel" required>

<button id="submitBtn" type="submit">Envoyer</button>
</form>

<iframe name="submitFrame" id="submitFrame"
style="display:none"></iframe>

<div id="status" role="status"></div>
</div>

<script>
const form = document.getElementById("registrationForm");
const frame = document.getElementById("submitFrame");
const status = document.getElementById("status");
const button = document.getElementById("submitBtn");

let waiting = false;

form.addEventListener("submit", () => {
  waiting = true;
  button.disabled = true;
  status.textContent = "Envoi en cours...";
});

frame.addEventListener("load", () => {
  if (!waiting) return;

  status.textContent =
    "Demande envoyée. Veuillez vérifier votre inscription auprès de l'administration.";
  form.reset();
  button.disabled = false;
  waiting = false;
});
</script>

</body>
</html>
